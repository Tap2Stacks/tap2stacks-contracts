[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# solc auto-detected: OpenZeppelin 5.7 EIP712 requires ^0.8.31
fs_permissions = [
    { access = "read", path = "./deployments" },
    { access = "read-write", path = "./out/base-sepolia.latest.json" },
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
